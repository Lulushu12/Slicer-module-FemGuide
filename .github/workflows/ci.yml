name: geometry-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 matches the Python shipped inside the pinned Slicer (see
        # docs/PINNED_VERSIONS.md); 3.13 keeps us honest for the future.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core library and FemGuide module logic
        run: pip install -e "./core[dev]" -e ./modules/femguide
      - name: Run tests
        run: pytest tests/ -v
