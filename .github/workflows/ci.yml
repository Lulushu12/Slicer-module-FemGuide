name: geometry-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 matches the Python shipped inside the pinned Slicer (see
        # docs/PINNED_VERSIONS.md); 3.12 keeps us honest for the future.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core library
        run: pip install -e "./core[dev]"
      - name: Run geometry tests
        run: pytest tests/ -v
